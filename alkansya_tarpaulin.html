<!doctype html>
<html lang="en">
<head>
<title>Alkansya Tarpaulin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&display=swap">
<style>
/* Alkansya Pro UI Color System Match ("Midnight & Warm Amber") */
:root {
  --bg-app: #0c1017;
  --bg-banner: #131b26;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --text-main: #fbfdff;
  --accent-gold: #f59e0b;
  --shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background-color: var(--bg-app);
  color: var(--text-main);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow-x: hidden;
}

.tarpaulin-banner {
  width: 100%;
  max-width: 1100px;
  min-height: 460px;
  background-color: var(--bg-banner);
  border: 1px solid var(--border-subtle);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 60px;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Grommets */
.grommet {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: linear-gradient(135deg, #cbd5e1, #64748b, #94a3b8);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 2px 4px rgba(255,255,255,0.2);
  border: 1px solid rgba(0,0,0,0.3);
}
.grommet-tl { top: 16px; left: 16px; }
.grommet-tr { top: 16px; right: 16px; }
.grommet-bl { bottom: 16px; left: 16px; }
.grommet-br { bottom: 16px; right: 16px; }

h1 {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(5rem, 16vw, 12rem);
  font-weight: 900;
  letter-spacing: -2px;
  line-height: 1;
  color: var(--accent-gold);
  text-transform: uppercase;
  user-select: none;
  cursor: default;
}

.sub-tag {
  margin-top: 16px;
  font-size: 0.85rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--text-main);
  opacity: 0.7;
  font-weight: 700;
}
</style>
</head>
<body>

<div class="tarpaulin-banner">
  <div class="grommet grommet-tl"></div>
  <div class="grommet grommet-tr"></div>
  <div class="grommet grommet-bl"></div>
  <div class="grommet grommet-br"></div>

  <h1>Alkansya</h1>
  <div class="sub-tag">Digital Savings Tracker</div>
</div>

</body>
</html>
